# Your Kloru on Fly.io: one always-on machine. Generated by deploy/selfhost/setup.py from deploy/selfhost/fly.template.toml.
app = "{app}"
primary_region = "{region}"
# Time to stop cleanly on a deploy: services close, then run.sh syncs the disk (memory commits were cut off at 5 s).
kill_timeout = "30s"

# No [build]: Fly would read the Dockerfile's path from this file's folder. setup.py passes it.

[env]
  KLORU_PUBLIC_URL = "https://{domain}"
  # Calls come in on the same host, at /twilio/*.
  PUBLIC_URL = "https://{domain}"
  KLORU_TRUST_PROXY = "1"
  KLORU_DEV_AGENT_URL = "http://127.0.0.1:8080"
  INSTINCT_URL = "http://127.0.0.1:8080"
  VOICE_PORT = "8765"
  # Calls file issues on the desk (packages/desk); "off" returns to one-sentence tasks.
  VOICE_DESK = "on"
  # Start Kloru's reply at Deepgram Flux's predicted end of turn (talking latency); "off" to compare.
  VOICE_EAGER_EOT = "on"
  # Engineers, scouts and memory (reading, research, drafting): Luna by default, the cheapest.
  # Terra ("openrouter/openai/gpt-6.1-terra") is smarter for hard errands, at 10× the price.
  KLORU_ENGINEER_MODEL = "openrouter/openai/gpt-6-luna"
  # What the agent calls itself in every message (never the framework's name).
  INSTINCT_AGENT_NAME = "Kloru"
  # The models: the agent and voice on OpenAI's Luna, the PM on Gemini Flash (all through OpenRouter).
  INSTINCT_MODEL = "openrouter/openai/gpt-6-luna"
  KLORU_PM_MODEL = "openrouter/google/gemini-3.5-flash"
  VOICE_MODEL = "openai/gpt-6-luna"
  # Who runs this Kloru, for the privacy and terms pages and their contact address.
  KLORU_OPERATOR = "{operator}"
  KLORU_CONTACT_EMAIL = "{contact}"
  # Apps the family can connect (Composio, each with Composio's own sign-in; see packages/web APP_CATALOG).
  COMPOSIO_TOOLKITS = "all"
  # The number people text (Inkbox's shared iMessage line); the opt-in is "connect @<INKBOX_AGENT_HANDLE>".
  KLORU_TEXT_NUMBER = "{text_number}"
  # Stripe Link sends the owner back to the agent through Caddy.
  LINK_REDIRECT_URI = "https://{domain}/oauth/link/callback"

[[mounts]]
  source = "kloru_data"
  destination = "/data"
  initial_size = "10gb"
  snapshot_retention = 7

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[restart]]
  policy = "always"
  retries = 10

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
