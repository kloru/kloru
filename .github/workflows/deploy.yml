name: deploy

# Every push to main that passes ci goes to Fly (app "kloru", fly.toml). See docs/DEPLOY-KLORU.md.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time, and a deploy that has started always finishes.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  fly:
    # Only Kloru's own repo deploys; a fork or a self-hosted copy has no token and skips this.
    if: github.repository == 'kloru/kloru' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy the commit that passed ci
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
