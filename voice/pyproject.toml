[project]
name = "kloru-voice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pipecat-ai[websocket,silero,deepgram,cartesia,openrouter,runner]==1.14.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "twilio>=9",
  "python-dotenv>=1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
