# Kloru on Fly.io: one always-on machine in San Jose. See docs/DEPLOY-KLORU.md.
app = "kloru"
primary_region = "sjc"
# Time to stop cleanly on a deploy: services close, then run.sh syncs the disk (memory commits were cut off at 5 s).
kill_timeout = "30s"

[build]
  dockerfile = "deploy/kloru/Dockerfile"

[env]
  KLORU_PUBLIC_URL = "https://kloru.com"
  PUBLIC_URL = "https://voice.kloru.com"
  KLORU_TRUST_PROXY = "1"
  KLORU_DEV_AGENT_URL = "http://127.0.0.1:8080"
  INSTINCT_URL = "http://127.0.0.1:8080"
  VOICE_PORT = "8765"
  # Calls file issues on the desk (packages/desk); "off" returns to one-sentence tasks.
  VOICE_DESK = "on"
  # Start Kloru's reply at Deepgram Flux's predicted end of turn (talking latency); "off" to compare.
  VOICE_EAGER_EOT = "on"
  # Engineers (reading, research, drafting) run on a smarter model; ops and the PM use the agent model.
  KLORU_ENGINEER_MODEL = "openrouter/openai/gpt-6.1-terra"
  # What the agent calls itself in every message (never the framework's name).
  INSTINCT_AGENT_NAME = "Kloru"
  # Apps the family can connect (Composio, each with Composio's own sign-in; see packages/web APP_CATALOG).
  COMPOSIO_TOOLKITS = "gmail,googlecalendar,outlook,googledrive,googledocs,googlesheets,googlephotos,googletasks,todoist,ticktick,notion,one_drive,dropbox,box,splitwise,calendly,zoom,slack,discord,youtube,linkedin,asana,trello,airtable"
  # The number people text (Inkbox's shared iMessage line); the opt-in is "connect @<INKBOX_AGENT_HANDLE>".
  KLORU_TEXT_NUMBER = "+16504849720"
  # Stripe Link sends the owner back to the agent through Caddy.
  LINK_REDIRECT_URI = "https://kloru.com/oauth/link/callback"

[[mounts]]
  source = "kloru_data"
  destination = "/data"
  initial_size = "3gb"
  snapshot_retention = 7

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[restart]]
  policy = "always"
  retries = 10

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
